<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#021526" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="#090d14"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyber Security Shield -->
  <path d="M32 11 L49 17.5 V30 C49 41.5 32 50.5 32 53 C32 50.5 15 41.5 15 30 V17.5 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Radar Scan Circles -->
  <circle cx="32" cy="29" r="11" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.5"/>
  <circle cx="32" cy="29" r="6" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="32" cy="29" r="2.2" fill="#22d3ee"/>

  <!-- Crosshairs -->
  <line x1="32" y1="18" x2="32" y2="40" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="21" y1="29" x2="43" y2="29" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Detected host target blip -->
  <circle cx="38" cy="24" r="1.8" fill="#10b981"/>
</svg>